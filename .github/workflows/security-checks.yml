name: Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Verificando secrets no código..."
          grep -rn "AKIA\|aws_secret\|password.*=.*['\"]\|api_key.*=.*['\"]" . \
            --include="*.md" --include="*.yml" --include="*.yaml" --include="*.json" \
            --exclude-dir=".git" || echo "Nenhum secret encontrado."

      - name: Validate SECURITY.md exists
        run: |
          if [ -f "SECURITY.md" ]; then
            echo "✅ SECURITY.md encontrado"
          else
            echo "❌ SECURITY.md não encontrado"
            exit 1
          fi
